
name: Extract ZIP Directly to Main

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4

      - name: Extract ZIP Directly
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path(".").resolve()

          for archive in root.glob("*.zip"):
              print("Extracting:", archive.name)

              with zipfile.ZipFile(archive) as z:
                  files = [
                      i for i in z.infolist()
                      if not i.is_dir()
                  ]

                  paths = [
                      Path(i.filename) for i in files
                  ]

                  common = Path(
                      __import__("os").path.commonpath(
                          [str(p) for p in paths]
                      )
                  )

                  if len(files) > 0 and all(
                      len(p.parts) > len(common.parts)
                      for p in paths
                  ):
                      prefix = common
                  else:
                      prefix = Path(".")

                  for item in files:
                      relative = Path(item.filename)

                      if prefix != Path("."):
                          relative = relative.relative_to(prefix)

                      if not relative.parts:
                          continue

                      target = (root / relative).resolve()

                      if not target.is_relative_to(root):
                          raise ValueError("Unsafe ZIP path")

                      if target.exists():
                          raise FileExistsError(
                              f"File already exists: {target}"
                          )

                      target.parent.mkdir(
                          parents=True, exist_ok=True
                      )

                      with z.open(item) as src:
                          with open(target, "wb") as dst:
                              dst.write(src.read())

          PY

      - name: Commit to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Extract ZIP directly to main"
            git push origin HEAD:main
          )
